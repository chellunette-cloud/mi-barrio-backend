openapi: 3.0.3
info:
  title: Mi Barrio · Contrato interno
  version: 0.1.0
  description: |
    Contrato canónico de la frontera interna entre mi-barrio-api y mi-barrio-backend.
    El backend no es público: solo se publica en la red privada de servicios.
    La API pública consume este contrato y valida cada respuesta antes de reexponerla.
servers:
  - url: http://mi-barrio-backend:3001
    description: Red privada de servicios (contenedores)
  - url: http://127.0.0.1:3001
    description: Desarrollo local
security:
  - ServiceToken: []
paths:
  /internal/v1/health:
    get:
      operationId: health
      security: []
      responses:
        '200':
          description: Servicio disponible
          content:
            application/json:
              schema:
                type: object
                required: [status, service]
                properties:
                  status: { type: string, enum: [ok] }
                  service: { type: string, example: mi-barrio-backend }
  /internal/v1/barrio:
    get:
      operationId: getBarrioInterno
      responses:
        '200':
          description: Ficha territorial y fuentes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Barrio'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /internal/v1/barrio/geometria:
    get:
      operationId: getBarrioGeometriaInterno
      responses:
        '200':
          description: Polígono oficial en WGS84
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BarrioGeometria'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorInterno'
components:
  securitySchemes:
    ServiceToken:
      type: apiKey
      in: header
      name: X-Service-Token
  responses:
    NoAutorizado:
      description: Token de servicio ausente o inválido
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NoEncontrado:
      description: Dato no cargado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ErrorInterno:
      description: Error controlado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Fuente:
      type: object
      required: [codigo, entidad, url, fechaConsulta, licencia, campos]
      properties:
        codigo: { type: string, example: F-01 }
        entidad: { type: string, example: SDP/UAECD }
        url: { type: string, format: uri }
        fechaConsulta: { type: string, format: date, example: '2026-11-15' }
        licencia: { type: string, example: CC BY 4.0 }
        campos:
          type: array
          items: { type: string }
    Barrio:
      type: object
      required:
        - slug
        - nombre
        - nombreMostrar
        - codigoId
        - localidad
        - upz
        - upl
        - area
        - lotes
        - poblacion
        - densidad
        - estratoPredominante
        - manzanasEstrato2
        - centroide
        - limites
        - actualizadoEn
        - fuentes
      properties:
        slug: { type: string, example: ciudad-granada }
        nombre: { type: string, example: URBANIZACION CIUDAD GRANADA }
        nombreMostrar: { type: string, example: Ciudad Granada }
        codigoId: { type: string, nullable: true, example: LEG00645 }
        localidad:
          type: object
          required: [codigo, nombre]
          properties:
            codigo: { type: string, example: '08' }
            nombre: { type: string, example: Kennedy }
        upz:
          type: object
          required: [codigo, nombre]
          properties:
            codigo: { type: string, example: '82' }
            nombre: { type: string, example: Patio Bonito }
        upl: { type: string, example: UPL14 }
        area:
          type: object
          required: [hectareas, metrosCuadrados]
          properties:
            hectareas: { type: number, example: 9.1 }
            metrosCuadrados: { type: number, example: 94551.13 }
        lotes: { type: integer, example: 705 }
        poblacion:
          type: object
          required: [valor, tipo, etiqueta]
          properties:
            valor: { type: integer, example: 3807 }
            tipo: { type: string, enum: [estimacion] }
            etiqueta: { type: string, example: Estimación del registro del barrio }
        densidad: { type: number, nullable: true, example: 77.4725 }
        estratoPredominante: { type: integer, nullable: true, example: 2 }
        manzanasEstrato2: { type: integer, example: 34 }
        centroide:
          $ref: '#/components/schemas/Punto'
        limites:
          $ref: '#/components/schemas/Limites'
        actualizadoEn: { type: string, format: date-time }
        fuentes:
          type: array
          items: { $ref: '#/components/schemas/Fuente' }
    BarrioGeometria:
      type: object
      required:
        - slug
        - nombre
        - codigoId
        - geometria
        - centroide
        - limites
        - area
        - vertices
        - srid
        - actualizadoEn
        - fuente
      properties:
        slug: { type: string, example: ciudad-granada }
        nombre: { type: string, example: URBANIZACION CIUDAD GRANADA }
        codigoId: { type: string, nullable: true, example: LEG00645 }
        geometria:
          $ref: '#/components/schemas/Polygon'
        centroide:
          $ref: '#/components/schemas/Punto'
        limites:
          $ref: '#/components/schemas/Limites'
        area:
          type: object
          required: [hectareas, metrosCuadrados]
          properties:
            hectareas: { type: number, example: 9.1 }
            metrosCuadrados: { type: number, example: 94551.13 }
        vertices: { type: integer, example: 58 }
        srid: { type: integer, enum: [4326] }
        actualizadoEn: { type: string, format: date-time }
        fuente:
          $ref: '#/components/schemas/Fuente'
    Polygon:
      type: object
      required: [type, coordinates]
      properties:
        type: { type: string, enum: [Polygon] }
        coordinates:
          type: array
          items:
            type: array
            items:
              type: array
              items: { type: number }
    Punto:
      type: object
      required: [lat, lon]
      properties:
        lat: { type: number, example: 4.641833 }
        lon: { type: number, example: -74.171758 }
    Limites:
      type: object
      required: [norte, sur, este, oeste]
      properties:
        norte: { type: number }
        sur: { type: number }
        este: { type: number }
        oeste: { type: number }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code: { type: string, example: NO_AUTORIZADO }
            message: { type: string }
            requestId: { type: string, nullable: true }
